title: Beat and Match to Pass
name: dupot-beat-match-to-pass # you probably want to 'snapcraft register <name>'
base: core22
version: "1.8" # just for humans, typically '1.2+git' or '1.3.2'
summary: Beat match to pass
description: |
  This Game was made with Godot 3.6.3
  Gordon must kill enemies to open gates and finish levels
  Use your sword to kill number of enemies needed to open each gates.

grade: stable
confinement: strict
contact: imikado@gmail.com
license: LGPL-2.1-only
issues: https://github.com/imikado/dupotBeatAndMatchToPass/issues
source-code: https://github.com/imikado/dupotBeatAndMatchToPass/
website: https://www.dupot.org/games.html

apps:
  dupot-beat-match-to-pass:
    command: beatmatchtopass.x86_64
    extensions: [gnome]
    plugs:
      - opengl
      - audio-playback
      - x11
      - wayland
      - joystick

parts:
  game:
    plugin: dump
    source: .
    organize:
      beatmatchtopass.x86_64: beatmatchtopass.x86_64
      beatmatchtopass.pck: beatmatchtopass.pck
    stage:
      - beatmatchtopass.x86_64
      - beatmatchtopass.pck
    prime:
      - beatmatchtopass.x86_64
      - beatmatchtopass.pck
    stage-packages:
      - libc6
